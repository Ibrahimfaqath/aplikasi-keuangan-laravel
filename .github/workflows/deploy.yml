name: Deploy to cPanel

# Jalan OTOMATIS setelah workflow "CI" selesai di branch main,
# dan hanya lanjut kalau CI hijau. Bisa juga dijalankan manual
# dari tab Actions -> Deploy to cPanel -> Run workflow.
on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    # Pengaman utama: kalau CI merah, job ini tidak jalan sama sekali.
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # workflow_run checkout main terbaru secara default,
          # kunci ke commit yang lolos CI biar tidak deploy yang belum dites.
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      # composer install TIDAK perlu di sini karena vendor/ di-exclude
      # (di-install di server via SSH biar selalu sinkron dengan composer.lock).

      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      # public/build tidak masuk git, jadi build di sini agar ikut terkirim.
      - name: Build frontend assets
        run: |
          npm ci
          npm run build
          echo "--- verify build ---"
          ls -lh public/build public/build/assets
          cat public/build/manifest.json

      # Deploy beneran ke cPanel via FTPS.
      #
      # PENTING: FTP_PATH di GitHub Secrets harus menunjuk ke project yang
      # BENAR-BENAR dipakai subdomain, yaitu "/laravel_finance" (bukan
      # "/home3/almahir/ibrahim_projects" — itu copy lama yang tidak dipakai).
      # Bukti: /finance.almahir.cloud/index.php me-load /laravel_finance/...,
      # bukan folder ibrahim_projects. Salah arah = asset/Blade baru tidak pernah
      # sampai ke situs live.
      # Action SamKirkland/FTP-Deploy-Action selalu "sukses" tapi nyatanya
      # TIDAK menaruh file di /laravel_finance (bukti: mtime file server tidak
      # pernah berubah sejak upload manual via lftp). Dipakai lftp mirror yang
      # sudah terbukti andal. delete-remote false: project live berisi .env,
      # storage/, dan file khusus server yang TIDAK boleh dihapus.
      - name: Deploy kode via lftp ke project live
        run: |
          TARGET="${{ secrets.FTP_PATH || '/laravel_finance' }}"
          echo "Target deploy: $TARGET"
          echo "Catatan: hardcoded default /laravel_finance (dibuktikan dari index.php docroot)"
          sudo apt-get update -q >/dev/null && sudo apt-get install -y -q lftp >/dev/null
          {
            lftp -u "${{ secrets.FTP_USER }}","${{ secrets.FTP_PASSWORD }}" \
              -e "set ssl:verify-certificate no; set ftp:ssl-protect-data true; \
              set xfer:clobber on; set mirror:parallel-transfer-count 2; set net:timeout 30; \
              mirror -R --no-perms --parallel=4 \
                --exclude-glob '.git/' \
                --exclude-glob '.github/' \
                --exclude-glob '.idea/' \
                --exclude-glob '.vscode/' \
                --exclude-glob 'node_modules/' \
                --exclude-glob 'vendor/' \
                --exclude-glob 'storage/' \
                --exclude-glob 'tests/' \
                --exclude-glob 'langchain-svc/' \
                --exclude-glob '.env' \
                --exclude-glob '.env.*' \
                --exclude-glob '*.log' \
                --exclude-glob '*.sqlite' \
                --exclude-glob '.phpunit.result.cache' \
                --exclude-glob 'public/hot' \
                --exclude-glob 'app/Providers/AppServiceProvider.php' \
                --exclude-glob 'public/.htaccess' \
                ./ $TARGET; \
              bye" \
              ftp://${{ secrets.FTP_HOST }}
          } > /tmp/gh-lftp.log 2>&1 || echo "WARN: deploy kode gagal via FTP (lihat _gh-lftp.log di docroot)"
          echo "lftp exit berhasil dicatat, upload log diagnostik:"
          lftp -u "${{ secrets.FTP_USER }}","${{ secrets.FTP_PASSWORD }}" \
            -e "set ssl:verify-certificate no; put -O /finance.almahir.cloud /tmp/gh-lftp.log; bye" \
            ftp://${{ secrets.FTP_HOST }} || echo "WARN: log tidak terupload"

      # Aset build (public/build) IDENTIK di-copy ke docroot subdomain
      # (/finance.almahir.cloud/build) karena itulah folder yang dilayani web
      # per <link href="/build/assets/...">. Manifest Laravel di
      # /laravel_finance/public/build hanya untuk resolve — file sebenarnya
      # Build -> docroot dengan SATU koneksi lftp, lalu bersihkan cache Laravel.
      # (Sebelumnya mirror build pakai action FTP kedua yang gagal ~1 detik —
      # diduga salah satu kebijakan batas koneksi hosting. lftp satu sesi
      # terbukti paling andal.) cache dibersihkan agar Blade/config baru
      # langsung ter-compile ulang karena SSH port 22/2222 diblokir hosting.
      - name: Mirror build ke docroot + bersihkan cache Laravel (satu koneksi)
        run: |
          sudo apt-get update -q && sudo apt-get install -y -q lftp
          lftp -u "${{ secrets.FTP_USER }}","${{ secrets.FTP_PASSWORD }}" \
            -e "set ssl:verify-certificate no; set ftp:ssl-protect-data true; \
            set xfer:clobber on; \
            mirror -R --delete --no-perms --parallel=2 $(pwd)/public/build /finance.almahir.cloud/build; \
            cd /laravel_finance/storage/framework/views; mrm -f *.php; \
            cd /laravel_finance/bootstrap/cache; mrm -f config.php routes-*.php events.php packages.php services.php; \
            bye" \
            ftp://${{ secrets.FTP_HOST }} || echo "WARN: mirror/cache gagal via FTP, lakukan manual via File Manager"

      # Post-deploy via SSH: opsional untuk sekarang karena port 22 & 2222
      # connection refused dari laptop maupun GitHub (firewall hosting blokir).
      # FTP tetap jalan. Cache dibersihkan manual via File Manager (lihat DEPLOY-CPANEL.md).
      # Aktifkan lagi (hapus continue-on-error) kalau CS sudah buka SSH.
      - name: Post-deploy via SSH
        continue-on-error: true
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          password: ${{ secrets.SSH_PASSWORD }}
          key: ${{ secrets.SSH_KEY }}
          port: ${{ secrets.SSH_PORT || 22 }}
          script: |
            set -e
            cd ${{ secrets.FTP_PATH || '/laravel_finance' }}
            echo "--- php version ---"
            (php -v || /opt/cpanel/ea-php83/root/usr/bin/php -v) | head -5
            # Pakai php 8.3 cPanel kalau php default masih 7.x/8.1
            if php -r 'exit(version_compare(PHP_VERSION, "8.3.0", ">=") ? 0 : 1);'; then
              PHP_BIN=php
            else
              PHP_BIN=/opt/cpanel/ea-php83/root/usr/bin/php
            fi
            echo "PHP_BIN=$PHP_BIN"
            $PHP_BIN -v | head -2
            # Vendor selalu sinkron otomatis (nol manual saat composer.lock berubah)
            if command -v composer >/dev/null 2>&1; then
              composer install --no-dev --optimize-autoloader --no-interaction --prefer-dist
            else
              $PHP_BIN ~/composer.phar install --no-dev --optimize-autoloader --no-interaction --prefer-dist
            fi
            $PHP_BIN artisan migrate --force
            # storage:link gagal kalau link sudah ada, jangan gagalkan deploy
            $PHP_BIN artisan storage:link || true
            # Bersihkan cache lama agar Blade + CSS baru langsung tampil
            $PHP_BIN artisan optimize:clear
            $PHP_BIN artisan optimize
            chmod -R 775 storage bootstrap/cache || true
            echo "post-deploy OK"
