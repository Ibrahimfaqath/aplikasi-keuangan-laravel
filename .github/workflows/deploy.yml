name: CI + Deploy via cPanel Git

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.3"
          coverage: none

      - name: Install dependencies
        run: composer install -q --no-ansi --no-interaction --no-scripts --no-progress --prefer-dist

      - name: Prepare environment
        run: |
          cp .env.example .env
          php artisan key:generate

      - name: Execute tests
        run: php artisan test

  # Build assets & commit ke repo agar cPanel Git Deploy
  # selalu mendapat build terbaru (public/build di-track di git).
  deploy:
    needs: ci
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Build frontend assets
        run: |
          npm ci
          npm run build
          echo "--- verify build ---"
          ls -lh public/build/assets
          cat public/build/manifest.json

      - name: Commit build artifacts [skip ci]
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add public/build/
          if git diff --staged --quiet; then
            echo "tidak ada perubahan build"
          else
            MANIFEST=$(cat public/build/manifest.json | python3 -c "import sys,json; print(list(json.load(sys.stdin).values())[0]['file'])")
            git commit -m "build: update assets ($MANIFEST) [skip ci]"
            git push
          fi

      # Verifikasi live setelah push (tunggu cPanel auto-deploy)
      - name: Verifikasi live site
        run: |
          echo "tunggu 60 detik untuk cPanel deploy..."
          sleep 60
          echo "=== /login ==="
          curl -sf https://finance.almahir.cloud/login | \
            grep -oE 'Masuk ke dompetku|Buat akun|app-[A-Za-z0-9_]+\.css' | \
            sort | uniq -c || echo "(gagal fetch /login)"
          echo "=== / ==="
          curl -sf https://finance.almahir.cloud/ | \
            grep -oE 'Mulai kelola uangmu|dompetku|app-[A-Za-z0-9_]+\.css' | \
            sort | uniq -c || echo "(gagal fetch /)"
          echo "=== manifest ==="
          curl -sf https://finance.almahir.cloud/build/manifest.json | \
            python3 -c "import sys,json; d=json.load(sys.stdin); print([v['file'] for v in d.values()])" || echo "(gagal fetch manifest)"
