name: Deploy to cPanel

# Jalan OTOMATIS setelah workflow "CI" selesai di branch main,
# dan hanya lanjut kalau CI hijau. Bisa juga dijalankan manual
# dari tab Actions -> Deploy to cPanel -> Run workflow.
on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    # Pengaman utama: kalau CI merah, job ini tidak jalan sama sekali.
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # composer install TIDAK perlu di sini karena vendor/ di-exclude
      # (sudah ada di server dari ZIP manual). Biar deploy 1-2 menit.

      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      # public/build tidak masuk git, jadi build di sini agar ikut terkirim.
      - name: Build frontend assets
        run: |
          npm ci
          npm run build

      # Deploy beneran ke cPanel via FTPS (dry-run sudah lulus verifikasi).
      - name: Deploy via FTPS
        uses: SamKirkland/FTP-Deploy-Action@v4.4.0
        with:
          server: ${{ secrets.FTP_HOST }}
          username: ${{ secrets.FTP_USER }}
          password: ${{ secrets.FTP_PASSWORD }}
          port: 21
          protocol: ftps
          # Sertifikat FTPS hosting bersama umumnya self-signed.
          # "loose" = tetap terenkripsi, tapi tidak menolak cert non-publik.
          security: loose
          local-dir: ./
          server-dir: ${{ secrets.FTP_PATH }}/
          dry-run: false
          exclude: |
            **/.git/**
            **/.github/**
            **/node_modules/**
            **/vendor/**
            **/.env
            **/.env.*
            **/storage/**
            **/database/*.sqlite
            **/tests/**
            **/*.log
            .phpunit.result.cache
            # vendor/ sudah ada di server dari ZIP manual (11rb file, 122MB).
            # Jangan kirim tiap deploy biar 1-2 menit. Update vendor hanya
            # manual via Terminal saat composer.lock berubah.
            # File khusus server, JANGAN timpa (lihat DEPLOY-CPANEL.md):
            # - AppServiceProvider versi server ada kustom cPanel
            app/Providers/AppServiceProvider.php
            # - .htaccess docroot versi server (ModSecurity off + cache)
            public/.htaccess
