name: Deploy to cPanel

# Jalan OTOMATIS setelah workflow "CI" selesai di branch main,
# dan hanya lanjut kalau CI hijau. Bisa juga dijalankan manual
# dari tab Actions -> Deploy to cPanel -> Run workflow.
on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    # Pengaman utama: kalau CI merah, job ini tidak jalan sama sekali.
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # workflow_run checkout main terbaru secara default,
          # kunci ke commit yang lolos CI biar tidak deploy yang belum dites.
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      # composer install TIDAK perlu di sini karena vendor/ di-exclude
      # (di-install di server via SSH biar selalu sinkron dengan composer.lock).

      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      # public/build tidak masuk git, jadi build di sini agar ikut terkirim.
      - name: Build frontend assets
        run: |
          npm ci
          npm run build
          echo "--- verify build ---"
          ls -lh public/build public/build/assets
          cat public/build/manifest.json

      # Deploy beneran ke cPanel via FTPS.
      #
      # FTP root akun ini = /home3/almahir/ibrahim_projects, sehingga project
      # live yang dipakai subdomain = /laravel_finance (relatif FTP root).
      # Bukti: /finance.almahir.cloud/index.php me-load ../laravel_finance/...
      # Manifest Laravel dibaca dari /laravel_finance/public/build (resolve),
      # sedangkan URL asset (<link href>) dilayani web dari folder docroot
      # /finance.almahir.cloud/build. KEDUANYA harus identik di tiap rilis.
      #
      # Pelajaran dari insiden CSS 404 (commit 2a8badd):
      # - Satu sesi lftp ber-mirror ke 2 lokasi bisa mati SETENGAH jalan; bila
      #   docroot ter-update dulu (dengan --delete) sementara project tidak,
      #   halaman merujuk manifest lama -> file CSS lama sudah terhapus -> 404.
      # - Semua step kini STRICT (gagal = job merah, tidak ditelan || echo)
      #   plus retry + verifikasi ulang (cmp manifest vs build lokal).
      # - Urutan aman: (1) kode -> project, (2) build -> PROJECT dulu,
      #   (3) build -> DOCCROOT TANPA --delete (hash lama tetap ada, jadi
      #   halaman yang ref-nya masih lama tidak pernah 404), (4) BARU prune
      #   hash lama di docroot setelah keduanya terbukti sinkron.
      - name: Deploy kode via lftp ke project live (strict + verify)
        run: |
          set -euo pipefail
          FTP_USER="${{ secrets.FTP_USER }}"
          FTP_PASS="${{ secrets.FTP_PASSWORD }}"
          FTP_HOST="${{ secrets.FTP_HOST }}"
          TARGET="${{ secrets.FTP_PATH || '/laravel_finance' }}"
          echo "Target deploy: $TARGET"

          # timeout 300: mencegah sambungan data FTP yang macet mengunci runner
          # selamanya (lftp default net:timeout=0 = tunggu tanpa batas).
          mirror_kode() {
            for i in 1 2 3; do
              echo "== deploy kode, percobaan $i =="
              if timeout 300 lftp -u "$FTP_USER","$FTP_PASS" \
                -e "set ssl:verify-certificate no; set ftp:ssl-protect-data true; \
                set xfer:clobber on; \
                set net:timeout 45; set net:max-retries 3; \
                mirror -R --no-perms --parallel=4 \
                  --exclude-glob '.git/' \
                  --exclude-glob '.github/' \
                  --exclude-glob '.idea/' \
                  --exclude-glob '.vscode/' \
                  --exclude-glob 'node_modules/' \
                  --exclude-glob 'vendor/' \
                  --exclude-glob 'storage/' \
                  --exclude-glob 'tests/' \
                  --exclude-glob 'langchain-svc/' \
                  --exclude-glob '.env' \
                  --exclude-glob '.env.*' \
                  --exclude-glob '*.log' \
                  --exclude-glob '*.sqlite' \
                  --exclude-glob '.phpunit.result.cache' \
                  --exclude-glob 'public/hot' \
                  --exclude-glob 'public/storage' \
                  --exclude-glob 'public/.htaccess' \
                  --exclude-glob 'public/build/' \
                  "$GITHUB_WORKSPACE/." "$TARGET"; \
                bye" \
                ftp://$FTP_HOST; then
                return 0
              fi
              echo "mirror kode gagal (percobaan $i), coba lagi..."
              sleep 20
            done
            return 1
          }

          mirror_kode || { echo "FAIL: deploy kode (mirror) gagal 3x."; exit 1; }

          # Verifikasi file penanda: tailwind.config.js harus identik di server.
          timeout 120 lftp -u "$FTP_USER","$FTP_PASS" \
            -e "set ssl:verify-certificate no; set ftp:ssl-protect-data true; \
            set net:timeout 45; set net:max-retries 2; \
            get \"$TARGET/tailwind.config.js\" -o /tmp/remote_tailwind.config.js; bye" \
            ftp://$FTP_HOST
          if ! cmp -s "$GITHUB_WORKSPACE/tailwind.config.js" /tmp/remote_tailwind.config.js; then
            echo "FAIL: tailwind.config.js di server belum sinkron dengan repo."
            exit 1
          fi
          echo "OK: kode ter-mirror & tailwind.config.js sinkron di $TARGET"

      - name: Mirror build -> project (--delete) + verify
        run: |
          set -euo pipefail
          FTP_USER="${{ secrets.FTP_USER }}"
          FTP_PASS="${{ secrets.FTP_PASSWORD }}"
          FTP_HOST="${{ secrets.FTP_HOST }}"
          TARGET="${{ secrets.FTP_PATH || '/laravel_finance' }}"
          LOCAL_MANIFEST="$GITHUB_WORKSPACE/public/build/manifest.json"
          DIR="$TARGET/public/build"

          sync_build() {
            for i in 1 2 3; do
              echo "== mirror build -> $DIR (percobaan $i) =="
              if timeout 300 lftp -u "$FTP_USER","$FTP_PASS" \
                -e "set ssl:verify-certificate no; set ftp:ssl-protect-data true; \
                set xfer:clobber on; \
                set net:timeout 45; set net:max-retries 3; \
                mirror -R --delete --no-perms --parallel=2 $GITHUB_WORKSPACE/public/build \"$DIR\"; bye" \
                ftp://$FTP_HOST; then
                if timeout 120 lftp -u "$FTP_USER","$FTP_PASS" \
                  -e "set ssl:verify-certificate no; set ftp:ssl-protect-data true; \
                  set net:timeout 45; set net:max-retries 2; \
                  get \"$DIR/manifest.json\" -o /tmp/remote_manifest.json; bye" \
                  ftp://$FTP_HOST && cmp -s "$LOCAL_MANIFEST" /tmp/remote_manifest.json; then
                  echo "OK: $DIR sinkron dengan build lokal."
                  return 0
                fi
              fi
              echo "sync $DIR belum sinkron (percobaan $i), coba lagi..."
              sleep 15
            done
            return 1
          }

          # (A) Project dulu: bila gagal, docroot TIDAK disentuh -> situs tetap
          #     di versi lama yang utuh (tidak pernah 404).
          sync_build || { echo "FAIL: mirror build ke project gagal 3x."; exit 1; }

      - name: Upload build -> docroot (tanpa --delete, aman) + verify
        run: |
          set -euo pipefail
          FTP_USER="${{ secrets.FTP_USER }}"
          FTP_PASS="${{ secrets.FTP_PASSWORD }}"
          FTP_HOST="${{ secrets.FTP_HOST }}"
          LOCAL_MANIFEST="$GITHUB_WORKSPACE/public/build/manifest.json"
          DIR="/finance.almahir.cloud/build"

          sync_build() {
            for i in 1 2 3; do
              echo "== upload build -> $DIR (percobaan $i) =="
              if timeout 300 lftp -u "$FTP_USER","$FTP_PASS" \
                -e "set ssl:verify-certificate no; set ftp:ssl-protect-data true; \
                set xfer:clobber on; \
                set net:timeout 45; set net:max-retries 3; \
                mirror -R --no-perms --parallel=2 $GITHUB_WORKSPACE/public/build \"$DIR\"; bye" \
                ftp://$FTP_HOST; then
                if timeout 120 lftp -u "$FTP_USER","$FTP_PASS" \
                  -e "set ssl:verify-certificate no; set ftp:ssl-protect-data true; \
                  set net:timeout 45; set net:max-retries 2; \
                  get \"$DIR/manifest.json\" -o /tmp/remote_docroot.json; bye" \
                  ftp://$FTP_HOST && cmp -s "$LOCAL_MANIFEST" /tmp/remote_docroot.json; then
                  echo "OK: $DIR sinkron dengan build lokal."
                  return 0
                fi
              fi
              echo "upload $DIR belum sinkron (percobaan $i), coba lagi..."
              sleep 15
            done
            return 1
          }

          # (B) Docroot MENARIK file baru tanpa menghapus file lama: halaman
          #     langsung merujuk manifest project (baru) => asset baru sudah ada
          #     => situs pulih walau langkah prune gagal sekalipun.
          sync_build || { echo "FAIL: upload build ke docroot gagal 3x."; exit 1; }

      - name: Prune hash lama di docroot (--delete, setelah manifest identik)
        run: |
          set -euo pipefail
          FTP_USER="${{ secrets.FTP_USER }}"
          FTP_PASS="${{ secrets.FTP_PASSWORD }}"
          FTP_HOST="${{ secrets.FTP_HOST }}"
          LOCAL_MANIFEST="$GITHUB_WORKSPACE/public/build/manifest.json"
          DIR="/finance.almahir.cloud/build"

          # Pastikan manifest docroot == lokal SEBELUM menghapus file lama.
          timeout 120 lftp -u "$FTP_USER","$FTP_PASS" \
            -e "set ssl:verify-certificate no; set ftp:ssl-protect-data true; \
            set net:timeout 45; set net:max-retries 2; \
            get \"$DIR/manifest.json\" -o /tmp/prune_check.json; bye" \
            ftp://$FTP_HOST
          if ! cmp -s "$LOCAL_MANIFEST" /tmp/prune_check.json; then
            echo "SKIP prune: manifest docroot belum sinkron (tidak berisiko)."
            exit 0
          fi

          for i in 1 2 3; do
            echo "== prune $DIR (percobaan $i) =="
            if timeout 300 lftp -u "$FTP_USER","$FTP_PASS" \
              -e "set ssl:verify-certificate no; set ftp:ssl-protect-data true; \
              set xfer:clobber on; \
              set net:timeout 45; set net:max-retries 3; \
              mirror -R --delete --no-perms --parallel=2 $GITHUB_WORKSPACE/public/build \"$DIR\"; bye" \
              ftp://$FTP_HOST; then
              timeout 120 lftp -u "$FTP_USER","$FTP_PASS" \
                -e "set ssl:verify-certificate no; set ftp:ssl-protect-data true; \
                set net:timeout 45; set net:max-retries 2; \
                get \"$DIR/manifest.json\" -o /tmp/prune_final.json; bye" \
                ftp://$FTP_HOST
              if ! cmp -s "$LOCAL_MANIFEST" /tmp/prune_final.json; then
                echo "FAIL: manifest docroot berubah setelah prune."
                exit 1
              fi
              echo "OK: hash lama di $DIR terprune."
              exit 0
            fi
            echo "prune gagal (percobaan $i), coba lagi..."
            sleep 15
          done
          echo "WARN: prune gagal 3x (aman — hanya menyisakan file lama tak dipakai)."
          exit 0

      - name: Bersihkan cache Laravel (Blade + konfigurasi) via FTP
        run: |
          set -euo pipefail
          FTP_USER="${{ secrets.FTP_USER }}"
          FTP_PASS="${{ secrets.FTP_PASSWORD }}"
          FTP_HOST="${{ secrets.FTP_HOST }}"
          # cache dibersihkan agar Blade/config baru langsung ter-compile ulang
          # (SSH port 22/2222 diblokir hosting, jadi tidak bisa artisan di sana).
          timeout 300 lftp -u "$FTP_USER","$FTP_PASS" \
            -e "set ssl:verify-certificate no; set ftp:ssl-protect-data true; \
            set net:timeout 45; set net:max-retries 3; \
            cd /laravel_finance/storage/framework/views; mrm -f *.php; \
            cd /laravel_finance/bootstrap/cache; \
            mrm -f config.php routes-*.php events.php packages.php services.php; \
            bye" \
            ftp://$FTP_HOST
          echo "OK: cache Laravel dibersihkan (Blade + bootstrap/cache)."

      # Post-deploy via SSH: opsional untuk sekarang karena port 22 & 2222
      # connection refused dari laptop maupun GitHub (firewall hosting blokir).
      # FTP tetap jalan. Cache dibersihkan manual via File Manager (lihat DEPLOY-CPANEL.md).
      # Aktifkan lagi (hapus continue-on-error) kalau CS sudah buka SSH.
      - name: Post-deploy via SSH
        continue-on-error: true
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          password: ${{ secrets.SSH_PASSWORD }}
          key: ${{ secrets.SSH_KEY }}
          port: ${{ secrets.SSH_PORT || 22 }}
          script: |
            set -e
            cd ${{ secrets.FTP_PATH || '/laravel_finance' }}
            echo "--- php version ---"
            (php -v || /opt/cpanel/ea-php83/root/usr/bin/php -v) | head -5
            # Pakai php 8.3 cPanel kalau php default masih 7.x/8.1
            if php -r 'exit(version_compare(PHP_VERSION, "8.3.0", ">=") ? 0 : 1);'; then
              PHP_BIN=php
            else
              PHP_BIN=/opt/cpanel/ea-php83/root/usr/bin/php
            fi
            echo "PHP_BIN=$PHP_BIN"
            $PHP_BIN -v | head -2
            # Vendor selalu sinkron otomatis (nol manual saat composer.lock berubah)
            if command -v composer >/dev/null 2>&1; then
              composer install --no-dev --optimize-autoloader --no-interaction --prefer-dist
            else
              $PHP_BIN ~/composer.phar install --no-dev --optimize-autoloader --no-interaction --prefer-dist
            fi
            $PHP_BIN artisan migrate --force
            # storage:link gagal kalau link sudah ada, jangan gagalkan deploy
            $PHP_BIN artisan storage:link || true
            # Bersihkan cache lama agar Blade + CSS baru langsung tampil
            $PHP_BIN artisan optimize:clear
            $PHP_BIN artisan optimize
            chmod -R 775 storage bootstrap/cache || true
            echo "post-deploy OK"