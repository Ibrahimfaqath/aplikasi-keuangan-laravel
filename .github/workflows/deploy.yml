name: Deploy to cPanel

# Jalan OTOMATIS setelah workflow "CI" selesai di branch main,
# dan hanya lanjut kalau CI hijau. Bisa juga dijalankan manual
# dari tab Actions -> Deploy to cPanel -> Run workflow.
on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    # Pengaman utama: kalau CI merah, job ini tidak jalan sama sekali.
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # workflow_run checkout main terbaru secara default,
          # kunci ke commit yang lolos CI biar tidak deploy yang belum dites.
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      # composer install TIDAK perlu di sini karena vendor/ di-exclude
      # (di-install di server via SSH biar selalu sinkron dengan composer.lock).

      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      # public/build tidak masuk git, jadi build di sini agar ikut terkirim.
      - name: Build frontend assets
        run: |
          npm ci
          npm run build
          echo "--- verify build ---"
          ls -lh public/build public/build/assets
          cat public/build/manifest.json

      # Deploy beneran ke cPanel via FTPS (dry-run sudah lulus verifikasi).
      - name: Deploy via FTPS
        uses: SamKirkland/FTP-Deploy-Action@v4.4.0
        with:
          server: ${{ secrets.FTP_HOST }}
          username: ${{ secrets.FTP_USER }}
          password: ${{ secrets.FTP_PASSWORD }}
          port: 21
          protocol: ftps
          # Sertifikat FTPS hosting bersama umumnya self-signed.
          # "loose" = tetap terenkripsi, tapi tidak menolak cert non-publik.
          security: loose
          local-dir: ./
          server-dir: ${{ secrets.FTP_PATH }}/
          dry-run: false
          log-level: verbose
          exclude: |
            **/.git/**
            **/.github/**
            **/node_modules/**
            **/vendor/**
            **/.env
            **/.env.*
            **/storage/**
            **/database/*.sqlite
            **/tests/**
            **/*.log
            **/public/hot
            .phpunit.result.cache
            # vendor/ di-install ulang di server via SSH (selalu sinkron
            # dengan composer.lock, tidak perlu upload 11rb file tiap deploy).
            # File khusus server, JANGAN timpa (lihat DEPLOY-CPANEL.md):
            # - AppServiceProvider versi server ada kustom cPanel
            app/Providers/AppServiceProvider.php
            # - .htaccess docroot versi server (ModSecurity off + cache)
            public/.htaccess

