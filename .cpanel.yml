---
# cPanel Git Version Control deploy hook.
# Dijalankan otomatis saat user klik "Deploy" di cPanel
# atau saat auto-deploy aktif.
#
# Semua task dijalankan dari repo checkout directory.
# DEPLOYPATH harus sesuai dengan FTP_PATH di GitHub Secrets.
deployment:
  tasks:
    - export DEPLOYPATH=/laravel_finance

    # 1) Copy semua file dari repo ke app directory
    - /bin/cp -R * $DEPLOYPATH

    # 2) Pastikan .env ada (jangan timpa yang sudah ada)
    - /bin/test -f $DEPLOYPATH/.env || /bin/cp .env.example $DEPLOYPATH/.env

    # 3) Bersihkan compiled views (Blade) agar view baru langsung ter-compile
    - /bin/rm -f $DEPLOYPATH/storage/framework/views/*.php

    # 4) Bersihkan config/routes/events cache
    - /bin/rm -f $DEPLOYPATH/bootstrap/cache/config.php
    - /bin/rm -f $DEPLOYPATH/bootstrap/cache/routes-*.php
    - /bin/rm -f $DEPLOYPATH/bootstrap/cache/events.php
    - /bin/rm -f $DEPLOYPATH/bootstrap/cache/packages.php
    - /bin/rm -f $DEPLOYPATH/bootstrap/cache/services.php

    # 5) Ensure proper permissions
    - /bin/chmod -R 775 $DEPLOYPATH/storage || /bin/true
    - /bin/chmod -R 775 $DEPLOYPATH/bootstrap/cache || /bin/true

    # 6) Seed data akun demo (idempoten, aman diulang tiap deploy)
    - /bin/sh -c 'cd $DEPLOYPATH && php artisan db:seed --class=DemoDataSeeder --force' || /bin/true
